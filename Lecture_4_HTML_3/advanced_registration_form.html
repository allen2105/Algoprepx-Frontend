<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMart</title>
</head>
<body>
    <h1>Create User Account:</h1>
     <form action="">
        <label for="fname">Full Name:</label>
        <input type="text" id="fname" placeholder="John Doe" required>

        <br><br>

        <label for="email">Email Id:</label>
        <input type="email" id="email" placeholder="johndoe@gmail.com" required>

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <br><br>

        <label for="cpassword">Confirm Password:</label>
        <input type="password" id="cpassword" placeholder="Confirm your password" required>

        <br><br>

        <label for="date">Date of Birth:</label>
        <input type="text" id="date" pattern="\d{4}-\d{2}-\d{2}" placeholder="YYYY-MM-DD" required>

        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" pattern="[+][9][1]\d{10}" placeholder="Eg: +919999888822" required>

        <br><br>

        <label for="credit">Credit Number:</label>
        <input type="text" id="credit" pattern="\d{16}" placeholder="Eg: 9123419999888822" required>

        <br><br>

        <label for="username">Username:</label>
        <input type="text" id="username" pattern="[A-Za-z0-9]+$" placeholder="Johndoe15" required>

        <br><br>

        <label for="url">Website URL:</label>
        <input type="text" id="url" pattern="https?://.+" placeholder="https://www.google.com/" required>

        <br><br>

        <label for="textarea">Comments:</label>
        <textarea name="" id="textarea" placeholder="Enter your comments here..." required></textarea>

        <br><br>

        <fieldset>
            <legend>Subscription Options:</legend>
            <input type="radio" name="subscription" id="emi">
            <label for="emi">EMI</label>

            <input type="radio" name="subscription" checked id="onetime">
            <label for="onetime">One Time</label>

        </fieldset> 

        <br><br>

        <label for="country">Country:</label>
        <select name="country" id="country">
            <option>India</option>
            <option selected>Japan</option>
            <option>USA</option>
        </select>

        <br><br>

        <label for="volume">Volume:</label>
        <input type="range" name="volume" id="volume" min="0" max="100" value="50">

        <br><br>

        <label for="reset">Want to start over?:</label>
        <input type="reset" id="reset">

        <br><br>
        <button type="submit">Register</button>
        
    </form>
</body>
</html>
