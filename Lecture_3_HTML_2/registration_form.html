<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <h1>Form</h1>

    <form action="">
      <label for="full-name">Full Name:</label>
      <input type="text" value="Allen Santhosh" readonly id="full-name" />

      <br /><br />

      <label for="nick-name">Nick Name:</label>
      <input type="text" id="nick-name" />

      <br /><br />

      <label for="password">Password:</label>
      <input type="password" minlength="8" id="password" />

      <br /><br />

      <label for="e-mail">Email Id:</label>
      <input type="email" id="e-mail" />

      <br /><br />

      <label for="num">Age:</label>
      <input type="number" min="18" max="60" id="num" />

      <br /><br />

      <label for="reg">Register now:</label>
      <input type="submit" id="reg"/>
    </form>

  </body>
</html>
